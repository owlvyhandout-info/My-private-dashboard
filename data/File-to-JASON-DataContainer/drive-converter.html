<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ตัวแปลง Google Drive URL → สำหรับ Owlvy App</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:'Sarabun',sans-serif}</style>
</head>
<body class="bg-slate-100 min-h-screen p-6">
<div class="max-w-2xl mx-auto space-y-4">

    <h1 class="text-xl font-bold text-slate-800">🔄 ตัวแปลง Google Drive URL</h1>
    <p class="text-xs text-slate-500">วางลิงก์ได้ทุกแบบ (/file/d/…, open?id=…, uc?…id=) รองรับหลายลิงก์ต่อบรรทัด</p>

    <textarea id="input" rows="4" class="w-full p-3 rounded-xl border border-slate-300 text-sm"
        placeholder="วางลิงก์ Google Drive ที่นี่ (หลายลิงก์ได้ หนึ่งลิงก์ต่อบรรทัด)"></textarea>

    <button onclick="convert()" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-sm">แปลง + ตรวจภาพ</button>
    <button onclick="copyAll()" id="copyBtn" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-sm hidden">📋 คัดลอกผลทั้งหมด</button>

    <div id="output" class="space-y-3"></div>
</div>

<script>
function extractId(u) {
    const m = u.match(/\/file\/d\/([a-zA-Z0-9_-]+)/)
           || u.match(/[?&]id=([a-zA-Z0-9_-]+)/)
           || u.match(/\/d\/([a-zA-Z0-9_-]+)/);
    return m ? m[1] : null;
}
let allConverted = [];

function convert() {
    const lines = document.getElementById("input").value.split("\n").map(s => s.trim()).filter(Boolean);
    const out = document.getElementById("output");
    const copyBtn = document.getElementById("copyBtn");
    out.innerHTML = ""; allConverted = [];
    if (!lines.length) { out.innerHTML = `<p class="text-rose-600 text-sm">⚠️ ยังไม่ได้วางลิงก์</p>`; return; }

    lines.forEach((line, i) => {
        const id = extractId(line);
        const card = document.createElement("div");
        card.className = "bg-white rounded-2xl p-4 shadow border border-slate-200 space-y-2";

        if (!id) {
            card.innerHTML = `<p class="text-sm text-rose-600 font-bold">❌ บรรทัด ${i+1}: ไม่พบ File ID</p>
                <p class="text-xs text-slate-400">${line.slice(0,80)}</p>`;
            out.appendChild(card); return;
        }

        const finalUrl = `https://lh3.googleusercontent.com/d/${id}`;
        allConverted.push(finalUrl);
        card.innerHTML = `
            <p class="text-xs text-slate-400 break-all">${line.slice(0,80)}</p>
            <p class="text-sm font-mono font-bold text-emerald-700 break-all" id="url_${i}">${finalUrl}</p>
            <div class="flex gap-2 items-center">
                <button onclick="copyOne(${i})" class="px-3 py-1.5 bg-slate-800 text-white rounded-lg text-xs font-bold">📋 คัดลอก</button>
                <span class="text-xs text-slate-400">ตรวจภาพ ↓ (โหลดได้ = สิทธิ์แชร์ถูกต้อง)</span>
            </div>
            <img src="${finalUrl}" class="max-h-40 rounded-xl border border-slate-200 bg-slate-50 p-1"
                 onload="this.nextElementSibling.remove()"
                 onerror="this.outerHTML='<p class=&quot;text-xs text-rose-600 font-bold&quot;>❌ ภาพโหลดไม่ได้ → ไปที่ไฟล์ใน Drive → แชร์ → เลือก &quot;ทุกคนที่มีลิงก์&quot;</p>'">`;
        out.appendChild(card);
    });
    copyBtn.classList.toggle("hidden", !allConverted.length);
}

function copyOne(i) {
    navigator.clipboard.writeText(document.getElementById("url_" + i).textContent);
    alert("คัดลอกแล้ว!");
}
function copyAll() {
    navigator.clipboard.writeText(allConverted.join("\n"));
    alert("คัดลอกทั้งหมด " + allConverted.length + " ลิงก์แล้ว!");
}
</script>
</body>
</html>
