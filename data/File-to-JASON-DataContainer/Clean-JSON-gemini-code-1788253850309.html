<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🦉 Owlvy House - Quiz Data Cleaner & Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="p-4 md:p-8">

  <div class="max-w-5xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-lg border border-slate-100">
    
    <!-- Header -->
    <div class="text-center mb-6">
      <div class="text-4xl mb-2">🦉</div>
      <h1 class="text-2xl font-bold text-slate-800">Owlvy Science Quiz Data Cleaner</h1>
      <p class="text-xs text-slate-500 mt-1">โปรแกรมทำความสะอาดและจัดฟอร์แมตข้อมูลข้อสอบดิบ (Fix Newlines, Smart Quotes, Trailing Comma & LaTeX)</p>
    </div>

    <!-- Input Section -->
    <div class="mb-4">
      <label class="block text-sm font-semibold text-slate-700 mb-2">1. วางข้อความ JSON ดิบที่ได้จาก AI หรือไฟล์ข้อสอบที่ยังไม่ Clean:</label>
      <textarea id="raw-input" class="w-full h-64 p-3 border border-slate-300 rounded-xl text-xs font-mono focus:ring-2 focus:ring-blue-500 outline-none" placeholder="วางข้อความดิบที่นี่..."></textarea>
    </div>

    <!-- Actions -->
    <div class="flex flex-wrap gap-3 mb-6">
      <button onclick="cleanAndFormat()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl shadow-md transition text-sm">
        ⚡ ทำความสะอาดและจัดฟอร์แมต (Clean & Validate)
      </button>
      <button onclick="clearAll()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-5 py-3 rounded-xl transition text-sm">
        🗑️ ล้างข้อมูล
      </button>
    </div>

    <!-- Status Alert -->
    <div id="status-box" class="hidden p-3 rounded-xl text-xs font-semibold mb-4 text-center"></div>

    <!-- Output Section -->
    <div id="output-container" class="hidden space-y-4">
      <div class="flex justify-between items-center">
        <label class="text-sm font-semibold text-slate-700">2. ผลลัพธ์ Strict Valid JSON (พร้อมใช้งาน 100%):</label>
        <span id="question-count" class="text-xs font-bold text-green-600 bg-green-50 px-2.5 py-1 rounded-full border border-green-200"></span>
      </div>
      
      <textarea id="clean-output" class="w-full h-80 p-3 border border-slate-300 rounded-xl text-xs font-mono bg-slate-50 focus:ring-2 focus:ring-green-500 outline-none" readonly></textarea>
      
      <button onclick="copyOutput()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-xl shadow-md transition text-base">
        📋 คัดลอก Strict JSON ทั้งหมดไปใช้งาน
      </button>
    </div>

  </div>

  <script>
    function sanitizeJSON(rawText) {
      let str = rawText.trim();
      if (!str) return null;

      // 1. ดักจับกรณีผู้ใช้เผลอเอา Prompt คำสั่งมาวาง[cite: 1]
      const promptMarkers = ["ภารกิจของคุณ", "STRICT FORMAT", "ห้ามมีข้อความนำหน้า"];[cite: 1]
      if (promptMarkers.some(marker => str.includes(marker))) {[cite: 1]
        throw new Error("นี่คือข้อความ Prompt คำสั่ง ไม่ใช่ข้อความ JSON ที่ AI ตอบกลับมาครับ");[cite: 1]
      }

      // 2. สกัดเอาเฉพาะก้อน Array [ ... ][cite: 1]
      const firstBracket = str.indexOf('[');[cite: 1]
      const lastBracket = str.lastIndexOf(']');[cite: 1]
      if (firstBracket !== -1 && lastBracket !== -1) {[cite: 1]
        str = str.substring(firstBracket, lastBracket + 1);[cite: 1]
      } else if (!str.startsWith('[') && !str.startsWith('{')) {
        str = '[' + str + ']';
      }

      // 3. แปลง Smart Quotes (ฟันหนูโค้ง) ให้เป็น Straight Quotes[cite: 1]
      str = str.replace(/[\u201C\u201D]/g, '"').replace(/[\u2018\u2019]/g, "'");[cite: 1]

      // 4. แปลง Newline ดิบกลาง String ข้อความ ให้เป็น \n อย่างปลอดภัย[cite: 1]
      str = (function fixNewlines(text) {[cite: 1]
        let result = '', inString = false, escapeNext = false;[cite: 1]
        for (let i = 0; i < text.length; i++) {[cite: 1]
          const ch = text[i];[cite: 1]
          if (escapeNext) { result += ch; escapeNext = false; continue; }[cite: 1]
          if (ch === '\\') { result += ch; escapeNext = true; continue; }[cite: 1]
          if (ch === '"') { inString = !inString; result += ch; continue; }[cite: 1]
          if (inString && (ch === '\n' || ch === '\r')) {[cite: 1]
            result += (ch === '\n') ? '\\n' : '\\r';[cite: 1]
            continue;[cite: 1]
          }
          result += ch;[cite: 1]
        }
        return result;[cite: 1]
      })(str);

      // 5. ตัด Trailing Comma (คอมม่าตัวสุดท้ายก่อนปิดวงเล็บ)[cite: 1]
      str = str.replace(/,(\s*[\]}])/g, '$1');[cite: 1]

      // 6. รักษาและซ่อมแซม Backslash สำหรับสูตร LaTeX (\Delta, \circ, \text{})[cite: 1]
      str = str.replace(/\\\\|\\["\\\/bfnrtu]|\\/g, (match) => {[cite: 1]
        return match.length === 2 ? match : '\\\\';[cite: 1]
      });

      // 7. เติม Quotes ให้ Unquoted Keys (เช่น id: 1) โดยเว้น URL http:// ไว้
      str = str.replace(/([{,]\s*)([a-zA-Z0-9_]+)\s*:(?!\/\/)/g, '$1"$2":');

      // 8. ลอง Parse
      try {
        return JSON.parse(str);
      } catch (e1) {
        try {
          return (new Function('return ' + str))();
        } catch (e2) {
          throw new Error("โครงสร้าง JSON เสียหายรุนแรง (เช่น ลืมปิดฟันหนูหรือข้อความถูกตัดกลางคัน): " + e1.message);
        }
      }
    }

    function cleanAndFormat() {
      const rawText = document.getElementById('raw-input').value;
      const statusBox = document.getElementById('status-box');
      const outputContainer = document.getElementById('output-container');
      const cleanOutput = document.getElementById('clean-output');
      const questionCount = document.getElementById('question-count');

      statusBox.classList.add('hidden');
      outputContainer.classList.add('hidden');

      if (!rawText.trim()) {
        alert("กรุณาเปิดหรือวางข้อความในช่องก่อนครับ");
        return;
      }

      try {
        const parsedData = sanitizeJSON(rawText);
        
        let questionsArray = [];
        if (Array.isArray(parsedData)) {
          questionsArray = parsedData;
        } else if (parsedData && typeof parsedData === 'object') {
          questionsArray = parsedData.questions || parsedData.data || parsedData.items || [parsedData];
        }

        if (questionsArray.length === 0) {
          throw new Error("ไม่พบรายการคำถามในชุดข้อมูล");
        }

        // แสดงผล
        cleanOutput.value = JSON.stringify(questionsArray, null, 2);
        questionCount.innerText = `พบข้อสอบทั้งหมด ${questionsArray.length} ข้อ`;
        
        statusBox.innerText = "✅ ทำความสะอาดและจัดฟอร์แมต JSON เรียบร้อยแล้ว!";
        statusBox.className = "p-3 rounded-xl text-xs font-semibold mb-4 text-center bg-green-50 text-green-700 border border-green-200";
        statusBox.classList.remove('hidden');
        outputContainer.classList.remove('hidden');

      } catch (err) {
        statusBox.innerText = "❌ เกิดข้อผิดพลาด: " + err.message;
        statusBox.className = "p-3 rounded-xl text-xs font-semibold mb-4 text-center bg-red-50 text-red-700 border border-red-200";
        statusBox.classList.remove('hidden');
      }
    }

    function clearAll() {
      document.getElementById('raw-input').value = '';
      document.getElementById('clean-output').value = '';
      document.getElementById('status-box').classList.add('hidden');
      document.getElementById('output-container').classList.add('hidden');
    }

    function copyOutput() {
      const copyText = document.getElementById("clean-output");
      copyText.select();
      document.execCommand("copy");
      alert("คัดลอก Strict Valid JSON เรียบร้อยแล้ว! นำไปใช้งานต่อได้ทันทีครับ");
    }
  </script>
</body>
</html>
