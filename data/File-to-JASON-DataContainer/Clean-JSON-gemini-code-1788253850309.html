<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🦉 Owlvy House - Science Data Cleaner</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-top: 0; }
    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; color: #34495e; font-size: 14px; }
    textarea { width: 100%; height: 220px; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-family: monospace; font-size: 13px; box-sizing: border-box; }
    .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
    button { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
    .btn-main { background-color: #3498db; color: white; flex: 1; }
    .btn-main:hover { background-color: #2980b9; }
    .btn-clear { background-color: #e74c3c; color: white; }
    .btn-clear:hover { background-color: #c0392b; }
    .btn-copy { background-color: #2ecc71; color: white; width: 100%; margin-top: 10px; font-size: 16px; padding: 14px; }
    .btn-copy:hover { background-color: #27ae60; }
    .status-box { padding: 12px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; display: none; font-size: 14px; }
    .status-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .status-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .output-box { display: none; margin-top: 20px; border-top: 2px dashed #ddd; padding-top: 15px; }
  </style>
</head>
<body>

<div class="container">
  <h2>🦉 Owlvy Science Quiz Data Cleaner Portal</h2>
  <p style="font-size: 13px; color: #666;">วางข้อความ JSON ดิบที่ได้จาก AI หรือข้อสอบที่มีปัญหาเพื่อซ่อมแซมและจัดฟอร์แมตให้เป็น Strict JSON 100%</p>

  <div class="form-group">
    <label for="rawInput">1. วางข้อความ JSON ดิบที่ต้องการ Clean:</label>
    <textarea id="rawInput" placeholder="วางข้อความดิบที่นี่..."></textarea>
  </div>

  <div class="btn-group">
    <button class="btn-main" onclick="runCleaner()">⚡ ทำความสะอาดและจัดฟอร์แมต (Clean & Validate)</button>
    <button class="btn-clear" onclick="resetForm()">🗑️ ล้างข้อมูล</button>
  </div>

  <div id="statusBox" class="status-box"></div>

  <div id="outputBox" class="output-box">
    <label for="cleanOutput">2. ผลลัพธ์ Strict Valid JSON (พร้อมใช้งานทันที):</label>
    <textarea id="cleanOutput" readonly style="background-color: #f8f9fa;"></textarea>
    <button class="btn-copy" onclick="copyResult()">📋 คัดลอก Strict JSON ไปใช้งาน</button>
  </div>
</div>

<script>
  function runCleaner() {
    var inputEl = document.getElementById('rawInput');
    var statusEl = document.getElementById('statusBox');
    var outputBoxEl = document.getElementById('outputBox');
    var cleanOutputEl = document.getElementById('cleanOutput');

    statusEl.style.display = 'none';
    outputBoxEl.style.display = 'none';
    statusEl.className = 'status-box';

    var str = inputEl.value.trim();
    if (!str) {
      alert("กรุณาวางข้อความในช่องก่อนกดทำความสะอาดครับ");
      return;
    }

    try {
      // 1. สกัดเฉพาะ [ ... ]
      var start = str.indexOf('[');
      var end = str.lastIndexOf(']');
      if (start !== -1 && end !== -1) {
        str = str.substring(start, end + 1);
      } else if (!str.startsWith('[') && !str.startsWith('{')) {
        str = '[' + str + ']';
      }

      // 2. แปลง Smart Quotes (ฟันหนูโค้ง)
      str = str.replace(/[\u201C\u201D]/g, '"').replace(/[\u2018\u2019]/g, "'");

      // 3. จัดการ Newline ดิบใน String
      var cleanedStr = '';
      var inString = false;
      var escapeNext = false;
      for (var i = 0; i < str.length; i++) {
        var ch = str[i];
        if (escapeNext) { cleanedStr += ch; escapeNext = false; continue; }
        if (ch === '\\') { cleanedStr += ch; escapeNext = true; continue; }
        if (ch === '"') { inString = !inString; cleanedStr += ch; continue; }
        if (inString && (ch === '\n' || ch === '\r')) {
          cleanedStr += (ch === '\n') ? '\\n' : '\\r';
          continue;
        }
        cleanedStr += ch;
      }
      str = cleanedStr;

      // 4. ตัด Trailing Comma
      str = str.replace(/,(\s*[\]}])/g, '$1');

      // 5. ซ่อม Backslash ในสูตร LaTeX
      str = str.replace(/\\\\|\\["\\\/bfnrtu]|\\/g, function(m) {
        return m.length === 2 ? m : '\\\\';
      });

      // 6. ซ่อม Unquoted key
      str = str.replace(/([{,]\s*)([a-zA-Z0-9_]+)\s*:(?!\/\/)/g, '$1"$2":');

      // 7. Parse เป็น Object
      var parsedData;
      try {
        parsedData = JSON.parse(str);
      } catch (e1) {
        parsedData = (new Function('return ' + str))();
      }

      var questionsArray = [];
      if (Array.isArray(parsedData)) {
        questionsArray = parsedData;
      } else if (parsedData && typeof parsedData === 'object') {
        questionsArray = parsedData.questions || parsedData.data || parsedData.items || [parsedData];
      }

      if (!questionsArray || questionsArray.length === 0) {
        throw new Error("ไม่พบรายการคำถามในข้อมูลนี้");
      }

      cleanOutputEl.value = JSON.stringify(questionsArray, null, 2);
      statusEl.innerHTML = "✅ ทำความสะอาดสำเร็จ! พบข้อสอบทั้งหมด <b>" + questionsArray.length + "</b> ข้อ";
      statusEl.className = 'status-box status-success';
      statusEl.style.display = 'block';
      outputBoxEl.style.display = 'block';

    } catch (err) {
      statusEl.innerText = "❌ เกิดข้อผิดพลาดในการ Clean: " + err.message;
      statusEl.className = 'status-box status-error';
      statusEl.style.display = 'block';
    }
  }

  function resetForm() {
    document.getElementById('rawInput').value = '';
    document.getElementById('cleanOutput').value = '';
    document.getElementById('statusBox').style.display = 'none';
    document.getElementById('outputBox').style.display = 'none';
  }

  function copyResult() {
    var copyText = document.getElementById("cleanOutput");
    copyText.select();
    document.execCommand("copy");
    alert("คัดลอก Strict Valid JSON เรียบร้อยแล้ว!");
  }
</script>

</body>
</html>
