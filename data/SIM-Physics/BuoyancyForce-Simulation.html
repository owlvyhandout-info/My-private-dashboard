<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulation แรงพยุงของของเหลว</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef6f8;--fg:#10303a;--card:#fff;--line:#b9d3da;--acc:#0b7a9e;--water:#4fb3d9;--obj:#8a8f98;--red:#d33f3f;--grn:#1f9d55;--org:#e08a00}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1a20;--fg:#e2f0f4;--card:#132830;--line:#2c4a55;--acc:#4cc2ea;--water:#2b7fa3;--obj:#a7adb7;--red:#ff7070;--grn:#4fd18a;--org:#ffb43a}}
:root[data-theme="dark"]{--bg:#0c1a20;--fg:#e2f0f4;--card:#132830;--line:#2c4a55;--acc:#4cc2ea;--water:#2b7fa3;--obj:#a7adb7;--red:#ff7070;--grn:#4fd18a;--org:#ffb43a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "Noto Sans Thai",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2em 0}
.sub{margin:0 0 12px;opacity:.8}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button[aria-selected=true]{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--org);outline-offset:2px}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-top:10px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{font-size:1.05rem;margin:0 0 6px}
svg{width:100%;height:auto;display:block;background:var(--card);border-radius:8px}
svg text{fill:var(--fg);font-family:inherit;font-size:13px}
.eq{font-weight:600;color:var(--acc);margin:4px 0}
label{display:block;margin:8px 0 2px;font-size:.92rem}
input[type=range]{width:100%}
select,input[type=number]{font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.btn{font:inherit;border:0;background:var(--acc);color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;margin:4px 6px 4px 0}
.btn.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
.out{background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:.95rem}
.ok{color:var(--grn);font-weight:600}.no{color:var(--red);font-weight:600}
.opt{display:block;width:100%;text-align:left;margin:4px 0}
</style></head><body><main>
<h1>แรงพยุงของของเหลว (Buoyancy)</h1>
<p class="sub">ทดลองเสมือนจริง 5 โหมด แล้วลองทำแบบฝึกหัดท้ายโหมด</p>
<nav id="nav" role="tablist"></nav>
<div class="grid">
 <div><div class="card"><svg id="stage" viewBox="0 0 520 360" role="img" aria-label="แบบจำลองการทดลอง"></svg></div></div>
 <div>
  <div class="card"><h2 id="mt"></h2><div id="goal"></div><div class="eq" id="eq"></div><div id="ctl"></div><div class="out" id="info" aria-live="polite"></div></div>
  <div class="card" style="margin-top:14px"><h2>แบบฝึกหัด</h2><div id="ex"></div></div>
 </div>
</div>
<script>
const $=id=>document.getElementById(id);
const S={m:0,d1:20,obj:'duck',st:0,rho:1000,V:200,g:9.8,add:0,liq:1000,h:5};
const DEF=JSON.stringify(S);
const svg=b=>'<defs>'+['red','grn','org','acc'].map(c=>`<marker id="m-${c}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--${c})"/></marker>`).join('')+'</defs>'+b;
const arr=(x,y1,y2,c,t,dx=6)=>Math.abs(y2-y1)<3?'':`<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="var(--${c})" stroke-width="3" marker-end="url(#m-${c})"/><text x="${x+dx}" y="${(y1+y2)/2+4}" style="fill:var(--${c})">${t}</text>`;
const f1=n=>n.toFixed(1);
const slider=(k,min,max,step,lab,fmt)=>`<label for="s${k}">${lab}: <b id="v${k}">${fmt(S[k])}</b></label><input id="s${k}" type="range" min="${min}" max="${max}" step="${step}" value="${S[k]}" oninput="S['${k}']=+this.value;$('v${k}').textContent=(${fmt})(S['${k}']);R()">`;
const sel=(k,opts,lab)=>`<label for="s${k}">${lab}</label><select id="s${k}" onchange="S['${k}']=+this.value;R()">${opts.map(o=>`<option value="${o[0]}" ${S[k]==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`;

const M=[
{n:'1 ชั่งในอากาศ vs ของเหลว',
 goal:'ลากวัตถุลงในน้ำ ดูว่าค่าบนเครื่องชั่งสปริงเปลี่ยนอย่างไร',eq:'F_B = W_air − W_liquid',
 ctl:()=>slider('d1',0,100,1,'ระดับการจม (เลื่อนลง)',v=>v+'%'),
 draw(){const top=60+S.d1*2,sub=Math.min(60,Math.max(0,top+60-150)),f=sub/60,fb=10*f,rd=30-fb;this.o={f,fb,rd};
  return svg(`<path d="M160 110V340H360V110" fill="none" stroke="var(--fg)" stroke-width="3"/><rect x="161" y="150" width="198" height="189" fill="var(--water)" opacity=".55"/>
  <line x1="260" y1="40" x2="260" y2="${top}" stroke="var(--fg)" stroke-width="2" stroke-dasharray="4 3"/><rect x="205" y="8" width="110" height="32" rx="6" fill="var(--bg)" stroke="var(--fg)"/><text x="260" y="30" text-anchor="middle" style="font-size:18px;font-weight:700">${f1(rd)} N</text>
  <rect x="230" y="${top}" width="60" height="60" fill="var(--obj)" stroke="var(--fg)"/>`+arr(260,top+30,top+30+60,'red','W = 30 N',6)+arr(238,top,top-rd*2,'grn','T',-16)+arr(282,top+60,top+60-fb*2,'org','F_B',6))},
 info(){const o=this.o;return `W_air = 30 N<br>F_B = ${f1(o.fb)} N<br>ค่าที่อ่านได้ = 30 − ${f1(o.fb)} = <b>${f1(o.rd)} N</b>`+(o.f>=1?'<br><span class="ok">จมมิดแล้ว: ลึกขึ้นค่าก็ไม่เปลี่ยน</span>':o.f>0?'<br>จมบางส่วน: ยิ่งจมมาก ค่ายิ่งลด':'<br>ยังอยู่ในอากาศ')},
 ex:{q:'ชั่งแท่งยางดิบในอากาศได้ 30 N เมื่อจมมิดในน้ำอ่านค่าได้ 20 N แรงพยุงเท่าใด (N)?',a:10,sol:'F_B = 30 − 20 = 10 N'}},

{n:'2 ถ้วยยูเรกา',
 goal:'ชั่งวัตถุในอากาศก่อน แล้วหย่อนลงถ้วยยูเรกา ดูน้ำที่ล้น',eq:'F_B = น้ำหนักของเหลวที่ถูกแทนที่',
 ctl:()=>sel('objs',[[0,'เป็ดยาง (ลอย)'],[1,'ก้อนโลหะ (จม)']],'เลือกวัตถุ').replace("S['objs']=+this.value","S.objs=+this.value;S.obj=S.objs?'metal':'duck';S.st=0")+`<button class="btn" onclick="S.st=1;R()">1) ชั่งในอากาศ</button><button class="btn" ${S.st<1?'disabled':''} onclick="S.st=2;R()">2) หย่อนลงถ้วย</button><button class="btn alt" onclick="S.st=0;R()">เริ่มใหม่</button>`,
 draw(){const d=S.obj=='duck',W=d?3:8,dw=3,st=S.st;
  const ox=st==2?280:90,oy=st==0?250:st==1?170:(d?165:275);
  const ob=d?`<ellipse cx="${ox}" cy="${oy}" rx="34" ry="20" fill="var(--org)" stroke="var(--fg)"/><circle cx="${ox+26}" cy="${oy-18}" r="12" fill="var(--org)" stroke="var(--fg)"/>`:`<rect x="${ox-25}" y="${oy-25}" width="50" height="50" fill="var(--obj)" stroke="var(--fg)"/>`;
  return svg(`<path d="M220 140V310H340V140L365 128" fill="none" stroke="var(--fg)" stroke-width="3"/><rect x="221" y="150" width="118" height="159" fill="var(--water)" opacity=".55"/>
  <rect x="370" y="290" width="110" height="20" fill="var(--line)"/><path d="M385 290V230H465V290" fill="none" stroke="var(--fg)" stroke-width="3"/>${st==2?`<rect x="386" y="${290-dw*10}" width="78" height="${dw*10}" fill="var(--water)" opacity=".7"/>`:''}
  <rect x="385" y="312" width="80" height="26" rx="4" fill="var(--bg)" stroke="var(--fg)"/><text x="425" y="330" text-anchor="middle" style="font-weight:700">${st==2?f1(dw):'0.0'} N</text>
  ${st==1?`<line x1="${ox}" y1="45" x2="${ox}" y2="${oy-20}" stroke="var(--fg)" stroke-dasharray="4 3"/><rect x="${ox-45}" y="12" width="90" height="32" rx="6" fill="var(--bg)" stroke="var(--fg)"/><text x="${ox}" y="34" text-anchor="middle" style="font-weight:700">${f1(W)} N</text>`:''}${ob}`+(st==2?arr(ox+(d?0:38),oy,oy-(d?dw*6:dw*6),'org','F_B',6)+arr(ox-(d?40:38),oy,oy+W*6,'red','mg',-40):''))},
 info(){const d=S.obj=='duck',W=d?3:8;if(S.st==0)return 'กด “ชั่งในอากาศ” เพื่อบันทึกน้ำหนักตั้งต้น';if(S.st==1)return `น้ำหนักในอากาศ = <b>${W} N</b> กด “หย่อนลงถ้วย” ต่อ`;
  return d?`น้ำล้น 3 N = น้ำหนักเป็ด (${W} N)<br>ปริมาตรน้ำล้น = ปริมาตรส่วนที่จม<br><b>F_b = mg</b> จึงลอยนิ่ง`:`น้ำล้น 3 N น้อยกว่าน้ำหนักโลหะ (${W} N)<br>ปริมาตรน้ำล้น = ปริมาตรทั้งก้อน<br><b>mg − F_b = ma</b> จึงจมลง`},
 ex:{q:'วัตถุหนัก 10 N ใส่ในยูเรกาที่เต็มน้ำ น้ำล้น 2 N แรงพยุงเท่าใด (N)?',a:2,sol:'F_B = น้ำหนักน้ำที่ล้น = 2 N (10 N เป็นตัวหลอก)'}},

{n:'3 คำนวณจากสูตร',
 goal:'ปรับ ρ, V, g แล้วดูลูกศรแรงพยุงยืดหด',eq:'F_B = ρ · V · g',
 ctl:()=>slider('rho',500,3000,50,'ความหนาแน่นของเหลว ρ',v=>v+' kg/m³')+slider('V',50,500,10,'ปริมาตรส่วนที่จม V',v=>v+' cm³')+sel('g',[[1.6,'ดวงจันทร์ 1.6'],[9.8,'โลก 9.8'],[24.8,'ดาวพฤหัส 24.8']],'ค่า g (m/s²)'),
 draw(){const fb=S.rho*S.V*1e-6*S.g,L=Math.min(150,fb*3.5),bh=30+S.V/8;this.fb=fb;
  return svg(`<rect x="130" y="120" width="260" height="220" fill="var(--water)" opacity="${.25+S.rho/4000}" stroke="var(--fg)" stroke-width="3"/>
  <rect x="${260-bh/2}" y="${250-bh/2}" width="${bh}" height="${bh}" fill="var(--obj)" stroke="var(--fg)"/>`+arr(260,250-bh/2,250-bh/2-L,'org','F_B = '+f1(fb)+' N',8))},
 info(){return `F_B = ${S.rho} × ${S.V}×10⁻⁶ × ${S.g}<br>= <b>${f1(this.fb)} N</b><br>แปรผันตรงกับ ρ, V และ g`},
 ex:{q:'ในอากาศชั่งได้ 14.0 N ในของเหลว (ρ = 2.0×10³ kg/m³) ได้ 8.0 N ให้ g = 10 วัตถุจมมิดมีปริมาตรกี่ ×10⁻⁴ m³?',a:3,sol:'F_B = 14−8 = 6 N → V = 6 / (2×10³×10) = 3.0×10⁻⁴ m³'}},

{n:'4 สมดุลแรง วัตถุลอย',
 goal:'ใส่มวลลงในเรือ แล้วเปลี่ยนชนิดของเหลว',eq:'ลอย: F_B = mg  |  จม: F_B + N = mg',
 ctl:()=>slider('add',0,1200,50,'มวลที่เพิ่ม',v=>v+' g')+sel('liq',[[1000,'น้ำจืด 1000'],[1025,'น้ำทะเล 1025'],[1240,'Dead Sea 1240']],'ของเหลว (kg/m³)'),
 draw(){const m=(300+S.add)/1000,A=.01,H=.12,g=10,dep=m/(S.liq*A),sunk=dep>H,d=Math.min(dep,H);
  const F=S.liq*A*d*g,W=m*g,N=Math.max(0,W-F);this.o={F,W,N,sunk};const y0=sunk?330-H*1500:150+ (0.03-dep)*0 ;
  const by=sunk?330-H*1500:(150+ (d*1500)-H*1500);
  return svg(`<rect x="90" y="150" width="340" height="190" fill="var(--water)" opacity=".5" stroke="var(--fg)" stroke-width="3"/>
  <path d="M200 ${by}h120v${H*1500}h-120z" fill="var(--card)" stroke="var(--fg)" stroke-width="3"/><rect x="215" y="${by-Math.min(60,S.add/20)}" width="90" height="${Math.min(60,S.add/20)}" fill="var(--obj)"/>`+
  arr(340,by+H*1500-d*1500/2+0,by+H*1500-d*1500/2-Math.min(120,F*10),'org','F_B',6)+arr(180,by+50,by+50+Math.min(120,W*10),'red','W',-24)+(sunk?arr(260,335,335-N*10,'grn','N',6):''))},
 info(){const o=this.o;return `W = ${f1(o.W)} N , F_B = ${f1(o.F)} N`+(o.sunk?`<br><span class="no">จมก้นภาชนะ</span> N = ${f1(o.N)} N`:`<br><span class="ok">ลอยนิ่ง</span> F_B = W`)},
 ex:{q:'วัตถุเดียวกันวางในของเหลว A–D: A จมก้น, B ลอยปริ่ม, C โผล่ครึ่ง, D โผล่มากสุด ข้อใดถูก?',opts:['F_B ของ B, C, D เท่ากัน และ ρ_D > ρ_C > ρ_B','F_B ของ D มากที่สุดเพราะโผล่มากสุด','F_B ของ A มากที่สุดเพราะจมก้น'],a:0,sol:'B, C, D ลอย จึง F_B = W เท่ากัน แต่ยิ่งโผล่มาก ρ ยิ่งมาก ส่วน A จม W > F_B'}},

{n:'5 ผลต่างความดัน',
 goal:'กดลูกบาศก์ให้ลึกขึ้น สังเกตผลต่างของลูกศรบนกับล่าง',eq:'F_B = (P_bottom − P_top) · A',
 ctl:()=>slider('h',1,20,1,'ความลึกผิวบน',v=>v+' cm'),
 draw(){const y=100+S.h*6,s=80,pt=S.h*1.2+6,pb=(S.h+10)*1.2+6;
  return svg(`<rect x="80" y="100" width="360" height="245" fill="var(--water)" opacity=".5"/><line x1="80" y1="100" x2="440" y2="100" stroke="var(--fg)" stroke-width="3"/>
  <rect x="220" y="${y}" width="${s}" height="${s}" fill="var(--card)" stroke="var(--fg)" stroke-width="2"/>`+arr(260,y-pt,y,'red','บน',8).replace(/(<line[^>]*)/,'$1')+arr(260,y+s+pb,y+s,'red','ล่าง',8)+
  `<path d="M${205-Math.min(40,S.h*2+10)} ${y+40}H215" stroke="var(--org)" stroke-width="3" marker-end="url(#m-org)"/><path d="M${315+Math.min(40,S.h*2+10)} ${y+40}H305" stroke="var(--org)" stroke-width="3" marker-end="url(#m-org)"/>`)},
 info(){const A=.01,ft=1000*10*(S.h/100)*A,fb=1000*10*((S.h+10)/100)*A;return `แรงบน = ${f1(ft)} N<br>แรงล่าง = ${f1(fb)} N<br>F_B = ${f1(fb)} − ${f1(ft)} = <b>${f1(fb-ft)} N</b> (คงที่เสมอ)<br>แรงข้างซ้าย–ขวาหักล้างกัน`},
 ex:{q:'ลูกบาศก์จมในของเหลว แรงบน 5.0 N ล่าง 7.50 N ด้านข้างด้านละ 6.25 N แรงพยุงเท่าใด (N)?',a:2.5,sol:'F_B = 7.50 − 5.0 = 2.50 N แนวราบหักล้างกัน'}}
];
function R(){const m=M[S.m];if(S.m==1)$('ctl').innerHTML=m.ctl();$('stage').innerHTML=m.draw();$('info').innerHTML=m.info()}
function pick(i){S.m=i;const m=M[i];[...$('nav').children].forEach((b,j)=>b.setAttribute('aria-selected',j==i));
 $('mt').textContent='โหมด '+m.n;$('goal').textContent=m.goal;$('eq').textContent=m.eq;$('ctl').innerHTML=m.ctl();
 const e=m.ex;$('ex').innerHTML=`<p>${e.q}</p>`+(e.opts?e.opts.map((o,k)=>`<button class="btn alt opt" onclick="chk(${k})">${'กขค'[k]}. ${o}</button>`).join(''):`<input id="ans" type="number" step="any" aria-label="คำตอบ"> <button class="btn" onclick="chk()">ตรวจคำตอบ</button>`)+'<div id="fb" class="out" hidden></div>';R()}
function chk(k){const e=M[S.m].ex,v=k!==undefined?k:parseFloat($('ans').value),ok=Math.abs(v-e.a)<=Math.abs(e.a)*.01+1e-9,f=$('fb');f.hidden=false;f.innerHTML=isNaN(v)?'ใส่คำตอบก่อน':(ok?'<span class="ok">ถูกต้อง</span>':'<span class="no">ยังไม่ถูก</span>')+'<br>'+e.sol}
M.forEach((m,i)=>{const b=document.createElement('button');b.role='tab';b.textContent=m.n;b.onclick=()=>pick(i);$('nav').appendChild(b)});
pick(0);
</script></main></body></html>
