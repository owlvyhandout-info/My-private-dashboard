<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owlvy Infographic Engine v6.2</title>
  <style>
    :root { --primary: #2c3e50; --accent: #3498db; --bg: #f4f7f6; --card: #ffffff; }
    body { font-family: 'Sarabun', 'Segoe UI', sans-serif; background: var(--bg); color: #333; padding: 20px; margin: 0; }
    .container { max-width: 850px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
    h1 { color: var(--primary); text-align: center; margin-bottom: 5px; }
    .version-badge { font-size: 0.5em; color: #888; background: #eee; padding: 3px 8px; border-radius: 20px; vertical-align: middle; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; color: #444; }
    select, textarea, input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 15px; transition: border 0.2s; }
    select:focus, textarea:focus { border-color: var(--accent); outline: none; }
    textarea { min-height: 100px; resize: vertical; }
    .btn { background: var(--accent); color: white; padding: 14px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; font-weight: 600; margin-top: 10px; transition: background 0.2s; }
    .btn:hover { background: #2980b9; }
    .btn:disabled { background: #bdc3c7; cursor: not-allowed; }
    #status { margin-top: 12px; text-align: center; font-weight: 600; min-height: 24px; }
    .loading { color: #e67e22; }
    .error { color: #e74c3c; }
    .success { color: #27ae60; }
    #output { background: #f8f9fa; padding: 16px; border-radius: 10px; margin-top: 20px; white-space: pre-wrap; display: none; border: 1px dashed #ccc; line-height: 1.6; font-family: monospace; font-size: 14px; }
    .rule-status { font-size: 14px; color: #666; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    #cautionDisplay { background: #eef2ff; padding: 12px; border-radius: 8px; min-height: 45px; font-style: italic; color: #444; border-left: 4px solid var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <h1>🦉 อาว์ลวี่ เฮาส์: Infographic Prompt Engine <span class="version-badge">v6.2</span></h1>
    <p class="rule-status" id="ruleStatus">🔄 กำลังโหลดกฎจากฐานข้อมูล...</p>

    <div class="form-group">
      <label>หมวดวิชา</label>
      <select id="subject"><option>ชีววิทยา</option><option>เคมี</option><option>ฟิสิกส์</option><option>โลกศาสตร์ (Earth Science)</option><option>ดาราศาสตร์</option></select>
    </div>
    <div class="form-group">
      <label>ระดับความเข้มข้น</label>
      <select id="level"><option>ประถมศึกษา</option><option>มัธยมต้น</option><option>มัธยมปลาย</option><option>Gifted / SMT Program</option></select>
    </div>
    <div class="form-group">
      <label>เนื้อหาวิชาการ (Content to Process)</label>
      <textarea id="content" placeholder="วางเนื้อหาหรือคำอธิบายที่ต้องการทำเป็นอินโฟกราฟิก..."></textarea>
    </div>
    <div class="form-group">
      <label>สไตล์ภาพ (Visual Style)</label>
      <select id="style">
        <option>การถ่ายภาพ ภาพยนตร์ / ภาพนิ่งจากภาพยนตร์</option><option>อนิเมะ / มังงะ</option><option>ภาพประกอบ ภาพร่าง / ลายเส้น</option><option>การ์ตูน / นิยายภาพ Western Comic (สีสันฉูดฉาด)</option><option>ภาพเรนเดอร์ 3 มิติ</option><option>จิบิ / Q-Style</option><option>ไอโซเมตริก</option><option>พิกเซลอาร์ต</option><option>ภาพวาดสีน้ำมัน</option><option>สีน้ำ</option><option>หมึก / สไตล์จีน</option><option>ย้อนยุค / วินเทจ</option><option>ไซเบอร์พังก์ / ไซไฟ</option><option>มินิมอลลิสต์</option><option>Diorama</option><option>Cut Section</option><option>Glass / Transparent Anatomy</option>
      </select>
    </div>
    <div class="form-group">
      <label>จำนวนหน้า (Pages)</label>
      <select id="pages"><option value="Auto">Auto (ให้ AI คำนวณความเหมาะสม)</option><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option><option value="4">4 หน้า</option><option value="5">5 หน้า</option></select>
    </div>
    <div class="form-group">
      <label>รูปแบบภาษาของผลลัพธ์</label>
      <select id="language"><option value="Prompt_EN_Content_TH">พร้อมท์ ENG | เนื้อหาภาพ TH (แนะนำ)</option><option value="Full_Thai">พร้อมท์ TH | เนื้อหาภาพ TH</option><option value="Full_ENG">พร้อมท์ ENG | เนื้อหาภาพ ENG</option></select>
    </div>
    <div class="form-group">
      <label>กฎเฉพาะของเนื้อหา (Content & Visual Accuracy)</label>
      <select id="rulesDropdown" disabled onchange="updateCautions()">
        <option value="">⏳ กำลังโหลดกฎ...</option>
      </select>
    </div>
    <div class="form-group">
      <label>กฎที่เลือกจะแสดงด้านล่าง:</label>
      <div id="cautionDisplay">กรุณาเลือกกฎหรือรอการโหลดข้อมูล</div>
    </div>

    <button class="btn" id="generateBtn" onclick="generatePrompt()">🚀 สร้าง Master Prompt (v6.2)</button>
    <div id="status"></div>
    <div id="output"></div>
  </div>

  <script>
    // ================= CONFIG =================
    // ⚠️ สำคัญ: วาง URL Web App ที่ได้จากการ Deploy ที่นี่ (ต้องมี https://script.google.com/...)
    const GAS_WEB_APP_URL = "วาง_URL_Web_App_จาก_GAS_ตรงนี้";
    // ==========================================

    let masterRules = {};
    let isRulesLoaded = false;
    const ruleStatusEl = document.getElementById("ruleStatus");
    const rulesDropdown = document.getElementById("rulesDropdown");
    const cautionDisplay = document.getElementById("cautionDisplay");
    const statusEl = document.getElementById("status");
    const outputEl = document.getElementById("output");
    const generateBtn = document.getElementById("generateBtn");

    // Warning #2 Fix: ตรวจสอบสถานะการโหลดก่อนอัพเดทข้อความ
    function updateCautions() {
      if (!isRulesLoaded) {
        cautionDisplay.textContent = "⚠️ กำลังรอกฎจากฐานข้อมูล...";
        cautionDisplay.style.color = "#e67e22";
        return;
      }
      const selected = rulesDropdown.value;
      cautionDisplay.textContent = selected ? masterRules[selected] || "ไม่มีรายละเอียดกฎ" : "(ยังไม่ได้เลือกกฎ)";
      cautionDisplay.style.color = selected ? "#333" : "#888";
    }

    async function syncRulesFromSheet() {
      // Bug #2 Fix: ตรวจสอบ URL แบบละเอียด พร้อมแจ้งผู้ใช้หากยังไม่ได้ตั้งค่า
      if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("วาง_URL") || !GAS_WEB_APP_URL.startsWith("https://")) {
        ruleStatusEl.innerHTML = "❌ <b>กรุณาตั้งค่า GAS_WEB_APP_URL ในโค้ด HTML ก่อนใช้งาน</b>";
        ruleStatusEl.style.color = "#e74c3c";
        rulesDropdown.innerHTML = '<option value="">🔒 ระบบรอการตั้งค่า URL</option>';
        return;
      }

      ruleStatusEl.innerHTML = "🔄 กำลังโหลดกฎจากฐานข้อมูล...";
      ruleStatusEl.style.color = "#e67e22";

      try {
        // Warning #3 Fix: เพิ่ม Timeout 15 วินาที และ Bug #1 Fix: เพิ่ม Content-Type Header
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000);

        const res = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }, // Bug #1 Fix
          body: JSON.stringify({ action: 'get_rules' }),
          signal: controller.signal
        }).finally(() => clearTimeout(timeoutId));

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        if (data.status === 'success' && data.rules) {
          masterRules = data.rules;
          rulesDropdown.innerHTML = '<option value="">-- เลือกกฎเฉพาะ --</option>';
          Object.keys(masterRules).forEach(key => {
            const opt = document.createElement('option');
            opt.value = key;
            opt.textContent = key;
            rulesDropdown.appendChild(opt);
          });
          rulesDropdown.disabled = false;
          isRulesLoaded = true;
          ruleStatusEl.innerHTML = "✅ โหลดกฎล่าสุดจากฐานข้อมูลสำเร็จ";
          ruleStatusEl.style.color = "#27ae60";
          updateCautions();
        } else {
          throw new Error(data.message || "ข้อมูลกฎไม่ถูกต้อง");
        }
      } catch (err) {
        console.error("Fetch Rules Error:", err);
        ruleStatusEl.innerHTML = `⚠️ ไม่สามารถโหลดกฎได้: ${err.message}`;
        ruleStatusEl.style.color = "#e67e22";
        rulesDropdown.innerHTML = '<option value="">❌ โหลดล้มเหลว (ลองรีเฟรชหน้า)</option>';
      }
    }

    async function generatePrompt() {
      if (!isRulesLoaded && Object.keys(masterRules).length === 0) {
        setStatus("⚠️ ระบบยังโหลดกฎไม่เสร็จ กรุณารอสักครู่", "error");
        return;
      }

      const payload = {
        subject: document.getElementById("subject").value,
        level: document.getElementById("level").value,
        content: document.getElementById("content").value,
        style: document.getElementById("style").value,
        pages: document.getElementById("pages").value,
        language: document.getElementById("language").value,
        cautions: rulesDropdown.value ? masterRules[rulesDropdown.value] : "ไม่มีกฎเฉพาะ"
      };

      if (!payload.content.trim()) {
        setStatus("❌ กรุณากรอกเนื้อหาวิชาการก่อนสร้าง Prompt", "error");
        return;
      }

      generateBtn.disabled = true;
      generateBtn.textContent = "⏳ กำลังประมวลผล AI...";
      setStatus("🔄 กำลังส่งคำขอไปยัง AI Engine (อาจใช้เวลา 10-30 วินาที)...", "loading");
      outputEl.style.display = 'none';

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 45000); // AI ใช้เวลานานกว่า

        const res = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }, // Bug #1 Fix
          body: JSON.stringify(payload),
          signal: controller.signal
        }).finally(() => clearTimeout(timeoutId));

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        if (data.status === 'success') {
          outputEl.textContent = data.aiResponse;
          outputEl.style.display = 'block';
          setStatus("✅ สร้าง Master Prompt สำเร็จ!", "success");
        } else {
          throw new Error(data.message || "AI ตอบกลับไม่สำเร็จ");
        }
      } catch (err) {
        console.error("Generate Error:", err);
        setStatus(`❌ เกิดข้อผิดพลาด: ${err.message}`, "error");
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = "🚀 สร้าง Master Prompt (v6.2)";
      }
    }

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = type;
    }

    // Bug #2 Fix: เรียกฟังก์ชันโหลดกฎเมื่อเปิดหน้าเว็บ พร้อมรองรับสถานะต่างๆ
    window.onload = syncRulesFromSheet;
  </script>
</body>
</html>
