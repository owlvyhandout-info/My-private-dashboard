
<style>

let current = 0;

function renderProgress() {
  const row = document.getElementById('progress-row');
  row.innerHTML = '';
  steps.forEach((s, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'step-dot-wrap' + (i === current ? ' active-wrap' : '');

    const dot = document.createElement('div');
    dot.className = 'step-dot' + (i === current ? ' active' : i < current ? ' done' : '');
    dot.textContent = i < current ? '✓' : i + 1;
    dot.onclick = () => { current = i; render(); };

    const lbl = document.createElement('div');
    lbl.className = 'step-dot-label';
    lbl.textContent = s.label;

    wrap.appendChild(dot);
    wrap.appendChild(lbl);
    row.appendChild(wrap);

    if (i < steps.length - 1) {
      const conn = document.createElement('div');
      conn.className = 'connector' + (i < current ? ' done-line' : '');
      row.appendChild(conn);
    }
  });
}

function renderPanel() {
  const s = steps[current];
  const tagMap = { setup: 'tag-setup', design: 'tag-design', code: 'tag-code', security: 'tag-security', test: 'tag-test' };
  const phaseMap = { setup: 'ตั้งค่า Firebase', design: 'ออกแบบ DB', code: 'เขียนโค้ด', security: 'ความปลอดภัย', test: 'ทดสอบ' };
  
  let html = `
    <div class="panel-header">
      <div>
        <span class="phase-tag ${tagMap[s.phase]}">${phaseMap[s.phase]}</span>
        <div class="panel-title" style="margin-top:6px">${s.title}</div>
        <div class="panel-sub">${s.sub}</div>
      </div>
    </div>
    <div class="analogy-box">${s.analogy}</div>
    <ul class="checklist">
      ${s.items.map(it => `<li class="${it.key ? 'key' : ''}"><i class="ti ${it.icon}" aria-hidden="true"></i><span>${it.text}</span></li>`).join('')}
    </ul>
  `;
  if (s.code) {
    html += `<div class="code-block"><pre style="white-space:pre-wrap">${s.code}</pre></div>`;
  }
  document.getElementById('panel-content').innerHTML = html;
  document.getElementById('step-counter').textContent = `ขั้นที่ ${current + 1} จาก ${steps.length}`;
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === steps.length - 1;
}

function render() { renderProgress(); renderPanel(); }
function navigate(dir) {
  current = Math.max(0, Math.min(steps.length - 1, current + dir));
  render();
}

render();
</script>
