<style>
  .modebtn{font-size:13px;padding:8px 12px;border-radius:10px;border:1px solid var(--border-default);background:var(--surface-1);color:var(--text-secondary);cursor:pointer;font-family:inherit;}
  .modebtn.active{background:#0B1D3A;color:#fff;border-color:#0B1D3A;}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
</style>
<h2 class="sr-only">เครื่องมือเปรียบเทียบเวลากับมุมของดวงจันทร์ เลือกได้ว่าจะคงเวลาสังเกตไว้เท่าเดิมหรือคงมุมไว้เท่าเดิม</h2>

<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-bottom:10px;">
  <div>
    <label style="display:block;font-size:13px;color:var(--text-secondary);margin-bottom:4px;">เวลาสังเกตวันที่ 1</label>
    <input type="time" id="startTime" value="20:00" style="font-size:15px;padding:5px 10px;border-radius:8px;border:1px solid var(--border-default);background:var(--surface-1);color:var(--text-primary);">
  </div>
  <div style="display:flex;gap:8px;">
    <button id="modeFixedTime" class="modebtn active" type="button">① คงเวลาไว้เท่าเดิม</button>
    <button id="modeFixedAngle" class="modebtn" type="button">② คงมุม/ตำแหน่งไว้เท่าเดิม</button>
  </div>
</div>
<div id="summaryLine" style="font-size:14px;color:var(--text-secondary);background:var(--surface-1);border-radius:10px;padding:8px 12px;margin-bottom:12px;"></div>

<svg width="100%" viewBox="0 0 680 360" role="img">
<title>เปรียบเทียบดวงจันทร์วันที่ 1 กับวันที่ 2 ตามเงื่อนไขที่เลือก</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text id="label1Time" x="165" y="42" text-anchor="middle" font-size="14" fill="#3D3D3A" font-weight="500">วันที่ 1</text>
<rect x="20" y="60" width="290" height="260" rx="16" fill="#0B1D3A"/>
<rect x="20" y="292" width="290" height="28" fill="#16213E"/>
<line x1="20" y1="292" x2="310" y2="292" stroke="#2B3A5C" stroke-width="1"/>
<circle cx="55" cy="90" r="1.3" fill="#E5E7EB" opacity="0.7"/>
<circle cx="95" cy="120" r="1.3" fill="#E5E7EB" opacity="0.5"/>
<circle cx="160" cy="80" r="1.3" fill="#E5E7EB" opacity="0.8"/>
<circle cx="270" cy="100" r="1.3" fill="#E5E7EB" opacity="0.6"/>
<circle cx="60" cy="200" r="1.3" fill="#E5E7EB" opacity="0.5"/>
<circle cx="280" cy="230" r="1.3" fill="#E5E7EB" opacity="0.6"/>
<circle cx="250" cy="140" r="2.4" fill="#FFFFFF"/>
<circle cx="225" cy="168" r="15" fill="#F5F0DC"/>
<text x="165" y="315" text-anchor="middle" font-size="12" fill="#A8B0C0">ตะวันออก · · · ตะวันตก</text>

<text id="label2Time" x="515" y="42" text-anchor="middle" font-size="14" fill="#3D3D3A" font-weight="500">วันที่ 2</text>
<rect x="370" y="60" width="290" height="260" rx="16" fill="#0B1D3A"/>
<rect x="370" y="292" width="290" height="28" fill="#16213E"/>
<line x1="370" y1="292" x2="660" y2="292" stroke="#2B3A5C" stroke-width="1"/>
<circle cx="405" cy="90" r="1.3" fill="#E5E7EB" opacity="0.7"/>
<circle cx="445" cy="120" r="1.3" fill="#E5E7EB" opacity="0.5"/>
<circle cx="510" cy="80" r="1.3" fill="#E5E7EB" opacity="0.8"/>
<circle cx="620" cy="100" r="1.3" fill="#E5E7EB" opacity="0.6"/>
<circle cx="410" cy="200" r="1.3" fill="#E5E7EB" opacity="0.5"/>
<circle cx="630" cy="230" r="1.3" fill="#E5E7EB" opacity="0.6"/>
<circle cx="600" cy="140" r="2.4" fill="#FFFFFF"/>
<line id="arrow2" x1="592" y1="147" x2="482" y2="222" stroke="#F2C94C" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text id="arrowLabel1" x="480" y="180" font-size="12" fill="#F2C94C" font-weight="500">13° ไปทางตะวันออก</text>
<text id="arrowLabel2" x="480" y="195" font-size="11" fill="#F2C94C">(สูงจากขอบฟ้าน้อยกว่าเดิม)</text>
<text id="sameBadge" x="585" y="150" font-size="11" fill="#7CD992" style="display:none">= ตำแหน่งเดิม</text>
<circle id="moon2" cx="470" cy="235" r="15" fill="#F5F0DC" style="transition:cx 0.5s ease,cy 0.5s ease"/>
<text x="515" y="315" text-anchor="middle" font-size="12" fill="#A8B0C0">ตะวันออก · · · ตะวันตก</text>
</svg>

<script>
(function(){
  let mode='fixedTime';
  const $=id=>document.getElementById(id);
  function addMinutes(hhmm,add){
    const parts=hhmm.split(':').map(Number);
    let total=parts[0]*60+parts[1]+add;
    total=((total%1440)+1440)%1440;
    const nh=Math.floor(total/60), nm=total%60;
    return String(nh).padStart(2,'0')+':'+String(nm).padStart(2,'0');
  }
  function render(){
    const t1=$('startTime').value||'20:00';
    $('label1Time').textContent='วันที่ 1 · '+t1+' น.';
    const moon2=$('moon2'), arrow2=$('arrow2'), aL1=$('arrowLabel1'), aL2=$('arrowLabel2'), badge=$('sameBadge');
    if(mode==='fixedTime'){
      $('label2Time').textContent='วันที่ 2 · '+t1+' น. (เวลาเดิม)';
      moon2.setAttribute('cx',470); moon2.setAttribute('cy',235);
      arrow2.style.display=''; aL1.style.display=''; aL2.style.display=''; badge.style.display='none';
      $('summaryLine').textContent='🔒 คงเวลาสังเกตไว้เท่าเดิมทุกวัน ('+t1+' น.) → ผลคือดวงจันทร์เลื่อนห่างจากตำแหน่งเดิมไปทางตะวันออก 13° และอยู่ต่ำกว่าเดิม';
    } else {
      const t2=addMinutes(t1,50);
      $('label2Time').textContent='วันที่ 2 · '+t2+' น. (+50 นาที)';
      moon2.setAttribute('cx',575); moon2.setAttribute('cy',168);
      arrow2.style.display='none'; aL1.style.display='none'; aL2.style.display='none'; badge.style.display='';
      $('summaryLine').textContent='🔒 คงมุม/ตำแหน่งของดวงจันทร์ให้เหมือนวันแรกทุกครั้ง → ต้องเลื่อนเวลาสังเกตออกไปอีก 50 นาที คือเวลา '+t2+' น.';
    }
  }
  $('modeFixedTime').onclick=function(){mode='fixedTime';this.classList.add('active');$('modeFixedAngle').classList.remove('active');render();};
  $('modeFixedAngle').onclick=function(){mode='fixedAngle';this.classList.add('active');$('modeFixedTime').classList.remove('active');render();};
  $('startTime').oninput=render;
  render();
})();
</script>
